<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Mode Validation — Cap Collège</title>
<link rel="stylesheet" href="styles.css?v=5.3.59">
</head>
<body class="validation-page">
<main class="page quality-page">
 <section class="card quality-toolbar">
  <div class="quality-primary-actions">
   <a class="btn btn-primary" href="cours-test.html">Tester les résumés de cours</a>
   <a class="btn btn-secondary" href="importer-contenus.html">Importer des questions</a>
  </div>
  <label>Matière <select id="subjectFilter" onchange="updateCategoryFilters()"></select></label>
  <label>Catégorie <select id="domainFilter" onchange="updateSubcategoryFilter()"></select></label>
  <label>Sous-catégorie <select id="skillFilter" onchange="applyFilters()"></select></label>
  <details class="advanced-quality-filters">
   <summary>Filtres avancés</summary>
   <div class="advanced-quality-filter-grid">
    <label>État <select id="statusFilter" onchange="applyFilters()"><option value="all">Toutes</option><option value="flagged">🚩 Questions signalées</option><option value="unreviewed" selected>Non testées</option><option value="A">A — excellente</option><option value="B">B — améliorable</option><option value="C">C — à réécrire</option><option value="D">D — à supprimer</option></select></label>
    <label>Version <select id="versionFilter" onchange="applyFilters()"><option value="all">Toutes</option></select></label>
    <label>Trier <select id="sortOrder" onchange="applyFilters()"><option value="id">N° de question</option><option value="version-desc">Version récente</option><option value="version-asc">Version ancienne</option></select></label>
    <label>Rechercher <input id="searchFilter" type="search" placeholder="mot ou numéro" oninput="applyFilters()"></label>
   </div>
  </details>
 </section>
 <section class="card quality-question">
  <div class="question-top"><strong id="testCounter"></strong><span id="questionIdentity"></span></div>
  <div class="progress"><div class="progress-bar" id="testProgress"></div></div>
  <div class="question-meta"><span class="meta meta-domain" id="testDomain"></span><span class="meta meta-skill" id="testSkill"></span><span class="meta" id="testVersion"></span></div>
  <h2 id="testQuestion"></h2>
  <div id="testQuestionVisual" class="hidden"></div>
  <div id="testChoices"></div>
  <div id="changeCommentNotice" class="notice hidden"></div>
  <div id="openFlagDetails" class="notice flag-details hidden"></div>
  <details id="previousVersionPanel" class="previous-version-panel hidden">
   <summary>Comparer avec la version précédente</summary>
   <div class="previous-version-content">
    <p class="small" id="previousVersionLabel"></p>
    <h3 id="previousQuestion"></h3>
    <div id="previousQuestionVisual" class="hidden"></div>
    <div id="previousChoices"></div>
    <div id="previousReview" class="previous-review hidden"></div>
   </div>
  </details>
  <div id="staleReviewNotice" class="notice stale-review-notice hidden" role="status"></div>
  <div class="review-panel">
   <h3 class="review-title">Évaluation de la qualité <span>Raccourcis : A, B, C ou D</span></h3>
   <div class="rating-grid">
    <button class="rating rating-a" data-rating="A" onclick="setRating('A')"><strong>A</strong><span>Excellente</span></button>
    <button class="rating rating-b" data-rating="B" onclick="setRating('B')"><strong>B</strong><span>À améliorer</span></button>
    <button class="rating rating-c" data-rating="C" onclick="setRating('C')"><strong>C</strong><span>À réécrire</span></button>
    <button class="rating rating-d" data-rating="D" onclick="setRating('D')"><strong>D</strong><span>À supprimer</span></button>
   </div>
   <label class="comment-label">Commentaire<textarea id="reviewComment" rows="2" placeholder="Ex. distracteurs peu crédibles, question ambiguë…" oninput="saveComment()"></textarea></label>
   <p class="small review-save-status" id="reviewSaveStatus" aria-live="polite"></p>
  </div>
  <div class="actions question-actions quality-nav"><button class="btn btn-secondary" onclick="previousTestQuestion()">Précédente</button><button class="btn btn-primary" onclick="nextTestQuestion()">Suivante</button></div>
 </section>
 <details class="card quality-tools-panel">
  <summary>Suivi, exports et avancement</summary>
  <section class="quality-summary" id="qualitySummary"></section>
  <section class="quality-export-card" aria-label="Export des retours">
  <div class="compact-export-bar">
   <button class="btn btn-primary" onclick="exportCorrections()">Exporter les questions à corriger</button>
   <button class="btn btn-secondary" onclick="exportJSON()">Exporter JSON</button>
   <button class="btn btn-secondary" onclick="exportCSV()">Exporter CSV</button>
   <button class="btn btn-secondary" onclick="copyReviews()">Copier les retours</button>
   <button class="btn btn-secondary" onclick="exportHTMLReport()">Rapport HTML</button>
  </div>
  <p class="small export-status" id="exportStatus" aria-live="polite"></p>
  </section>
  <section><h2>Avancement par thème</h2><div id="skillDashboard" class="skill-dashboard"></div></section>
 </details>
</main>
<script src="site-navigation.js?v=5.3.19"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="educational-content.js?v=5.3.48"></script>
<script src="question-visuals.js?v=5.3.56"></script>
<script src="supabase-app.js?v=5.3.40"></script>
<script src="test-loader.js?v=5.3.51"></script>
</body>
</html>
